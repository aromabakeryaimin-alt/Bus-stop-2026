<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九巴實時預報 APP 1933 Lite</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --card-border: #1f1f1f;
            --primary-red: #e60012;
            --accent-yellow: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #888888;
            --nav-bg: #0a0a0a;
            --keyboard-bg: #111111;
            --key-bg: #1c1c1e;
            --key-active: #333333;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .app-header {
            background-color: var(--nav-bg);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .app-header .logo {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-red);
            letter-spacing: 0.5px;
        }

        .clock-info {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
        }

        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .app-view {
            display: none;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            padding-bottom: 70px;
        }

        .app-view.active {
            display: block;
        }

        /* 首頁區塊 */
        .home-section {
            padding: 16px;
        }

        .home-banner {
            background: linear-gradient(135deg, #1f1f1f 0%, #111111 100%);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .home-banner-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .home-banner-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-muted);
            margin: 10px 16px;
        }

        /* 搜尋輸入框 */
        .search-box-container {
            padding: 12px 16px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            outline: none;
        }

        .search-input::placeholder {
            color: #555555;
            font-weight: normal;
        }

        .search-input:focus {
            border-color: var(--accent-yellow);
        }

        .search-input-icon {
            position: absolute;
            left: 12px;
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        /* 路線列表卡片 */
        .route-list {
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
        }

        .card-item {
            background-color: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            cursor: pointer;
        }

        .card-item:active {
            background-color: #1a1a1a;
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .route-no {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            min-width: 50px;
        }

        .dest-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }

        .via-info {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .card-right {
            text-align: right;
        }

        .eta-main {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-yellow);
        }

        .eta-sub {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .dir-tabs {
            display: none;
            gap: 8px;
            padding: 0 16px 12px 16px;
        }

        .dir-btn {
            flex: 1;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .dir-btn.active {
            background-color: var(--primary-red);
            color: #ffffff;
            border-color: var(--primary-red);
        }

        /* 地圖展開 */
        #map-overlay {
            display: none;
            height: 220px;
            width: 100%;
            border-bottom: 1px solid var(--card-border);
        }
        #map { height: 100%; width: 100%; }

        .status-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 20px 0;
        }

        /* 自訂底部虛擬鍵盤 */
        .custom-keyboard {
            display: none;
            position: absolute;
            bottom: 60px; /* 在導覽列之上 */
            left: 0;
            width: 100%;
            background-color: var(--keyboard-bg);
            padding: 8px 6px;
            z-index: 999;
            grid-template-columns: 3fr 2fr;
            gap: 6px;
            border-top: 1px solid var(--card-border);
        }

        .custom-keyboard.active {
            display: grid;
        }

        .kb-nums {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .kb-chars {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .kb-btn {
            background-color: var(--key-bg);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            font-weight: 500;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 1px 1px rgba(0,0,0,0.3);
        }

        .kb-btn:active {
            background-color: var(--key-active);
        }

        .kb-icon {
            width: 22px;
            height: 22px;
            fill: var(--text-main);
        }

        .kb-btn.darker {
            background-color: #151515;
            color: var(--text-muted);
        }

        /* 底部導覽列 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--nav-bg);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #555555;
            font-size: 11px;
            cursor: pointer;
            width: 25%;
            padding: 6px 0;
        }

        .nav-item.active {
            color: var(--accent-yellow);
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <div class="logo">APP 1933 LITE</div>
            <div class="clock-info" id="clock">--:--</div>
        </div>

        <div class="main-content">
            
            <!-- 首頁 -->
            <div id="view-home" class="app-view active">
                <div class="home-section">
                    <div class="home-banner">
                        <div class="home-banner-title">九巴實時預報系統</div>
                        <div class="home-banner-sub">輕量版介面，極速查詢到站時間</div>
                    </div>
                </div>
                <div class="section-title">熱門路線快捷點擊</div>
                <div id="homePopularList" class="route-list"></div>
            </div>

            <!-- 搜尋頁 -->
            <div id="view-search" class="app-view">
                <div class="search-box-container">
                    <div class="search-input-wrapper">
                        <svg class="search-input-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <!-- 加入 readonly 阻擋手機預設鍵盤彈出，改用自訂鍵盤 -->
                        <input type="text" id="routeInput" class="search-input" placeholder="路線" readonly onclick="showKeyboard()">
                    </div>
                </div>

                <div id="dirTabs" class="dir-tabs"></div>

                <div id="map-overlay">
                    <div id="map"></div>
                </div>

                <div id="statusMsgSearch" class="status-text">請輸入路線號碼</div>
                <div id="searchList" class="route-list"></div>
            </div>

            <!-- 附近 -->
            <div id="view-nearby" class="app-view">
                <div class="section-title">附近巴士站</div>
                <div id="statusMsgNearby" class="status-text">正在獲取位置...</div>
                <div id="nearbyList" class="route-list"></div>
            </div>

            <!-- 收藏 -->
            <div id="view-fav" class="app-view">
                <div class="section-title">已收藏路線</div>
                <div id="statusMsgFav" class="status-text">尚無收藏路線</div>
                <div id="favList" class="route-list"></div>
            </div>
        </div>

        <!-- 自訂虛擬鍵盤 (還原圖片下方設計) -->
        <div id="customKeyboard" class="custom-keyboard">
            <!-- 左側數字區 -->
            <div class="kb-nums">
                <button class="kb-btn" onclick="typeKey('1')">1</button>
                <button class="kb-btn" onclick="typeKey('2')">2</button>
                <button class="kb-btn" onclick="typeKey('3')">3</button>
                <button class="kb-btn" onclick="typeKey('4')">4</button>
                <button class="kb-btn" onclick="typeKey('5')">5</button>
                <button class="kb-btn" onclick="typeKey('6')">6</button>
                <button class="kb-btn" onclick="typeKey('7')">7</button>
                <button class="kb-btn" onclick="typeKey('8')">8</button>
                <button class="kb-btn" onclick="typeKey('9')">9</button>
                <button class="kb-btn darker" onclick="hideKeyboard()">
                    <svg class="kb-icon" viewBox="0 0 24 24"><path d="M19 15l-7-7-7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="scale(1, -1) translate(0, -24)"/></svg>
                </button>
                <button class="kb-btn" onclick="typeKey('0')">0</button>
                <button class="kb-btn darker" onclick="deleteKey()">
                    <svg class="kb-icon" viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
                </button>
            </div>
            <!-- 右側英文字母區 (常用九巴字尾) -->
            <div class="kb-chars">
                <button class="kb-btn" onclick="typeKey('A')">A</button>
                <button class="kb-btn" onclick="typeKey('B')">B</button>
                <button class="kb-btn" onclick="typeKey('C')">C</button>
                <button class="kb-btn" onclick="typeKey('D')">D</button>
                <button class="kb-btn" onclick="typeKey('M')">M</button>
                <button class="kb-btn" onclick="typeKey('P')">P</button>
                <button class="kb-btn" onclick="typeKey('S')">S</button>
                <button class="kb-btn" onclick="typeKey('X')">X</button>
            </div>
        </div>

        <!-- 底部導覽列 -->
        <div class="bottom-nav">
            <div id="nav-home" class="nav-item active" onclick="switchMainTab('home')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span>首頁</span>
            </div>
            <div id="nav-search" class="nav-item" onclick="switchMainTab('search')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <span>搜尋</span>
            </div>
            <div id="nav-nearby" class="nav-item" onclick="switchMainTab('nearby')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span>附近</span>
            </div>
            <div id="nav-fav" class="nav-item" onclick="switchMainTab('fav')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                <span>收藏</span>
            </div>
        </div>
    </div>

    <script>
        let allStopsMap = {};
        let allRoutesData = [];
        let isDataReady = false;
        let refreshInterval = null;
        let map, routeLayerGroup;
        let favorites = JSON.parse(localStorage.getItem('kmb_favorites') || '[]');

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            routeLayerGroup = L.featureGroup().addTo(map);
        }

        async function initApp() {
            try {
                const [stopsRes, routesRes] = await Promise.all([
                    fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop'),
                    fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/')
                ]);

                const stopsData = await stopsRes.json();
                stopsData.data.forEach(stop => {
                    allStopsMap[stop.stop] = { name: stop.name_tc, lat: stop.lat, lng: stop.long };
                });

                const routesData = await routesRes.json();
                allRoutesData = routesData.data;
                isDataReady = true;
                
                initMap();
                renderPopularRoutes();
            } catch (err) {
                console.error("載入失敗");
            }
        }

        /* 自訂鍵盤操作邏輯 */
        const routeInput = document.getElementById('routeInput');
        const keyboard = document.getElementById('customKeyboard');

        function showKeyboard() {
            keyboard.classList.add('active');
        }

        function hideKeyboard() {
            keyboard.classList.remove('active');
        }

        function typeKey(char) {
            routeInput.value += char;
            handleSearchInput();
        }

        function deleteKey() {
            routeInput.value = routeInput.value.slice(0, -1);
            handleSearchInput();
        }

        /* 介面切換 */
        function switchMainTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));

            document.getElementById(`nav-${tabName}`).classList.add('active');
            document.getElementById(`view-${tabName}`).classList.add('active');

            hideKeyboard(); // 切換分頁時隱藏鍵盤

            if (tabName === 'search') {
                if(routeInput.value === '') showKeyboard();
            } else if (tabName === 'fav') {
                renderFavoritesView();
            } else if (tabName === 'nearby') {
                renderNearbyView();
            }
        }

        function renderPopularRoutes() {
            const popular = ['1A', '273A', '270B', '78B', '276B'];
            const homePopularList = document.getElementById('homePopularList');
            homePopularList.innerHTML = '';

            popular.forEach(rt => {
                const matched = allRoutesData.find(r => r.route === rt && r.service_type === "1");
                if (matched) {
                    appendRouteCard(homePopularList, matched, true);
                }
            });
        }

        function appendRouteCard(container, routeData, isHome = false) {
            const card = document.createElement('div');
            card.className = 'card-item';
            card.onclick = () => {
                switchMainTab('search');
                routeInput.value = routeData.route;
                searchRoute(routeData.route);
            };

            card.innerHTML = `
                <div class="card-left">
                    <div class="route-no">${routeData.route}</div>
                    <div>
                        <div class="dest-title">往 ${routeData.dest_tc}</div>
                        <div class="via-info">由 ${routeData.orig_tc} 出發</div>
                    </div>
                </div>
                <div class="card-right">
                    <span style="color:var(--text-muted); font-size:12px;">查看 ></span>
                </div>
            `;
            container.appendChild(card);
        }

        function handleSearchInput() {
            const val = routeInput.value.trim().toUpperCase();
            if (val === '') {
                document.getElementById('dirTabs').style.display = 'none';
                document.getElementById('map-overlay').style.display = 'none';
                document.getElementById('searchList').innerHTML = '';
                document.getElementById('statusMsgSearch').textContent = '請輸入路線號碼';
                return;
            }
            searchRoute(val);
        }

        function searchRoute(routeNum) {
            if (!isDataReady) return;
            
            const matches = allRoutesData.filter(r => r.route === routeNum && r.service_type === "1");
            const searchList = document.getElementById('searchList');
            const dirTabs = document.getElementById('dirTabs');
            const statusMsg = document.getElementById('statusMsgSearch');

            if (matches.length === 0) {
                statusMsg.textContent = `找不到路線 ${routeNum}`;
                searchList.innerHTML = '';
                dirTabs.style.display = 'none';
                document.getElementById('map-overlay').style.display = 'none';
                return;
            }

            statusMsg.textContent = '';
            dirTabs.style.display = 'flex';
            dirTabs.innerHTML = '';
            hideKeyboard(); // 找到路線後自動收起鍵盤

            matches.forEach((m, idx) => {
                const btn = document.createElement('div');
                btn.className = `dir-btn ${idx === 0 ? 'active' : ''}`;
                btn.textContent = `往 ${m.dest_tc}`;
                btn.onclick = () => {
                    document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadStopsAndETA(m.route, m.bound, m.service_type);
                };
                dirTabs.appendChild(btn);
            });

            loadStopsAndETA(matches[0].route, matches[0].bound, matches[0].service_type);
        }

        async function loadStopsAndETA(route, bound, serviceType) {
            if (refreshInterval) clearInterval(refreshInterval);
            const searchList = document.getElementById('searchList');
            document.getElementById('statusMsgSearch').textContent = "載入班次...";
            searchList.innerHTML = '';

            try {
                const boundStr = bound === 'O' ? 'outbound' : 'inbound';
                const [stopsRes, etaRes] = await Promise.all([
                    fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${boundStr}/${serviceType}`),
                    fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}/${serviceType}`)
                ]);

                const stopsData = await stopsRes.json();
                const etaData = await etaRes.json();
                document.getElementById('statusMsgSearch').textContent = '';

                const etasBySeq = {};
                etaData.data.forEach(item => {
                    if (item.dir === bound && item.eta) {
                        if (!etasBySeq[item.seq]) etasBySeq[item.seq] = [];
                        etasBySeq[item.seq].push(item.eta);
                    }
                });

                routeLayerGroup.clearLayers();
                const latLngs = [];

                stopsData.data.forEach(item => {
                    const stop = allStopsMap[item.stop];
                    const stopName = stop ? stop.name : "車站";
                    const etas = etasBySeq[item.seq] || [];

                    if (stop) latLngs.push([stop.lat, stop.lng]);

                    let etaDisplay = '暫無數據';
                    let etaSubDisplay = '';
                    if (etas.length > 0) {
                        const mins = calcMins(etas[0]);
                        etaDisplay = mins <= 0 ? '即將到站' : `${mins} 分鐘`;
                        if (etas[1]) {
                            etaSubDisplay = `${calcMins(etas[1])} 分鐘`;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'card-item';
                    card.onclick = () => {
                        if (stop) {
                            const mapOverlay = document.getElementById('map-overlay');
                            mapOverlay.style.display = 'block';
                            map.invalidateSize();
                            map.setView([stop.lat, stop.lng], 16);
                            
                            const marker = L.marker([stop.lat, stop.lng]);
                            routeLayerGroup.clearLayers();
                            routeLayerGroup.addLayer(marker);
                        }
                    };

                    card.innerHTML = `
                        <div class="card-left">
                            <span style="background:var(--primary-red); color:#fff; border-radius:50%; min-width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:bold;">${item.seq}</span>
                            <div class="dest-title">${stopName}</div>
                        </div>
                        <div class="card-right">
                            <div class="eta-main">${etaDisplay}</div>
                            <div class="eta-sub">${etaSubDisplay}</div>
                        </div>
                    `;
                    searchList.appendChild(card);
                });

                refreshInterval = setInterval(() => loadStopsAndETA(route, bound, serviceType), 30000);
            } catch (err) {
                document.getElementById('statusMsgSearch').textContent = "載入失敗";
            }
        }

        function calcMins(isoTime) {
            const diff = new Date(isoTime).getTime() - new Date().getTime();
            const mins = Math.floor(diff / 60000);
            return mins < 0 ? 0 : mins;
        }

        function renderFavoritesView() {
            const favList = document.getElementById('favList');
            favList.innerHTML = '';
            document.getElementById('statusMsgFav').textContent = favorites.length === 0 ? "尚無收藏" : "";
        }

        function renderNearbyView() {
            const nearbyList = document.getElementById('nearbyList');
            nearbyList.innerHTML = '';
            document.getElementById('statusMsgNearby').textContent = "請允許瀏覽器定位";
        }

        initApp();
    </script>
</body>
</html>
