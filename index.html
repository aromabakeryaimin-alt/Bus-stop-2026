<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CSIS 管理員數碼器（手機掃碼）</title>
<style>
:root{--p:#003366;--a:#0066cc;--bg:#e9ecef;--card:#fff;--bd:#c8d1d9;--tx:#222;--ok:#007a33;--bad:#b30000}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#16212c;--bd:#2c3b4a;--tx:#e8eef4}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{background:var(--p);color:#fff;padding:14px 18px;font-weight:700}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:18px;margin-bottom:14px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid var(--bd);border-radius:4px;font-size:1.1rem;background:var(--card);color:var(--tx)}
button{width:100%;padding:14px;border:0;border-radius:6px;background:var(--a);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
#cam{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:1/1}
video{width:100%;height:100%;object-fit:cover}
#frame{position:absolute;inset:18%;border:3px solid #7ee08a;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
#st{text-align:center;font-weight:700;padding:12px;border-radius:6px;background:var(--card);border:1px solid var(--bd);margin-top:12px}
#st.ok{background:var(--ok);color:#fff}#st.bad{background:var(--bad);color:#fff}
[hidden]{display:none!important}
</style></head><body>
<header>📱 CSIS 管理員數碼器</header>
<main>
 <div id="gate" class="card"><h3>管理員驗證</h3><p style="margin-top:6px;opacity:.8">請輸入與電腦終端機相同的管理員 PIN。</p>
  <input id="pin" type="password" inputmode="numeric" placeholder="管理員 PIN" autocomplete="off"><button id="go">解鎖</button></div>
 <div id="scan" hidden>
  <div id="cam"><video id="v" playsinline muted></video><div id="frame"></div></div>
  <div id="st">按下方按鈕開啟鏡頭</div>
  <button id="cbtn" style="margin-top:12px">開啟鏡頭</button>
  <button id="pbtn" style="margin-top:10px;background:var(--card);color:var(--tx);border:1px solid var(--bd)">📷 改用拍照掃描（無需 https）</button>
  <input id="pf" type="file" accept="image/*" capture="environment" hidden>
  <p style="text-align:center;margin-top:10px;font-size:.85rem;opacity:.7">已傳送 <b id="n">0</b> 次　·　掃描結果會即時顯示於電腦終端機</p>
 </div>
</main>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyD42CHramMOT5yu6d0WhkMFs_5ZwQiPvPI",authDomain:"ks11-a4274.firebaseapp.com",databaseURL:"https://ks11-a4274-default-rtdb.firebaseio.com",projectId:"ks11-a4274"});
const database=firebase.database(),$=id=>document.getElementById(id),enc=new TextEncoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),rnd=()=>hex(crypto.getRandomValues(new Uint8Array(8)));
async function pbkdf2(p,salt){const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256))}
const st=(t,c='')=>{$('st').textContent=t;$('st').className=c};
let fails=0,lock=0,sent=0,lastCode='',lastAt=0,stream=null;

$('go').onclick=async()=>{
 if(Date.now()<lock)return alert('嘗試次數過多，請稍後再試。');
 $('go').disabled=true;
 try{const c=(await database.ref('/admin/cfg').once('value')).val();
  if(!c)return alert('尚未設定管理員 PIN，請先在電腦終端機設定。');
  if(await pbkdf2($('pin').value,c.salt)!==c.hash){if(++fails>=5){lock=Date.now()+60000;fails=0}return alert('PIN 錯誤。')}
  $('pin').value='';$('gate').hidden=true;$('scan').hidden=false}
 catch(e){alert('連線錯誤：'+(e.code||e.message))}finally{$('go').disabled=false}};

$('cbtn').onclick=async()=>{
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}}});
  $('v').srcObject=stream;await $('v').play();$('cbtn').hidden=true;st('請將市民二維碼對準框內');loop()}
 catch(e){
  let m='無法開啟鏡頭（'+(e.name||'錯誤')+'）：';
  if(!window.isSecureContext||!navigator.mediaDevices)m+='本頁不是 https，瀏覽器已封鎖鏡頭。請用 https 網址開啟，或按下方「拍照掃描」。';
  else if(e.name==='NotAllowedError')m+='鏡頭權限被拒絕。請按網址列左邊 🔒 → 網站設定 → 允許相機，然後重新整理。';
  else if(e.name==='NotFoundError')m+='找不到鏡頭。';
  else if(e.name==='NotReadableError')m+='鏡頭被其他程式佔用，請先關閉。';
  else m+='請改用 Chrome / Safari 直接開啟（不要用 LINE、WhatsApp、Facebook 內置瀏覽器）。';
  st(m,'bad')}};

/* 後備：用系統相機拍照後解碼（http / file:// 亦可使用） */
$('pbtn').onclick=()=>$('pf').click();
$('pf').onchange=e=>{
 const f=e.target.files[0];if(!f)return;const img=new Image();
 img.onload=()=>{const s=Math.min(1,1200/img.width);cv.width=img.width*s;cv.height=img.height*s;cx.drawImage(img,0,0,cv.width,cv.height);
  const q=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});
  URL.revokeObjectURL(img.src);e.target.value='';
  q&&q.data.startsWith('CSIS.')?send(q.data):st('未能辨識二維碼，請靠近並重新拍攝。','bad')};
 img.src=URL.createObjectURL(f)};

const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function loop(){
 const v=$('v');
 if(v.readyState>=2&&v.videoWidth){const s=Math.min(1,640/v.videoWidth);cv.width=v.videoWidth*s;cv.height=v.videoHeight*s;cx.drawImage(v,0,0,cv.width,cv.height);
  const q=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});
  if(q&&q.data.startsWith('CSIS.')&&(q.data!==lastCode||Date.now()-lastAt>4000))send(q.data)}
 requestAnimationFrame(loop)}

async function send(code){
 lastCode=code;lastAt=Date.now();
 try{await database.ref('/scanFeed/latest').set({code,n:rnd(),ts:firebase.database.ServerValue.TIMESTAMP});
  $('n').textContent=++sent;navigator.vibrate&&navigator.vibrate(120);st('✅ 已傳送至電腦，請查看電腦畫面','ok')}
 catch(e){st('傳送失敗：'+(e.code||e.message),'bad')}}
</script></body></html>
