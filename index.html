<!DOCTYPE html>
<html lang="zh-HK" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>九巴報站 Lite · 內測版 0.1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root {
  --red: #d7000f;
  --amber: #f5a100;
  --led: #ffb020;
  --panel: #060606;
  --bg: #e9edf1;
  --card: #ffffff;
  --ink: #11161c;
  --muted: #59636f;
  --line: #d9dee4;
  --soft: #f2f4f7;
  --accent: #c4000d;
  --sel: #fdecee;
  --field: #ffffff;
  --key: #ffffff;
  --key-line: #cfd5dc;
  --glass: rgba(255,255,255,.42);
  --glass-hi: rgba(255,255,255,.72);
  --glass-line: rgba(255,255,255,.75);
  --glass-edge: rgba(20,30,45,.09);
  --glass-shadow: 0 4px 14px rgba(30,45,70,.10);
  --glass-tint: rgba(215,0,15,.14);
  --app-bg: radial-gradient(120% 60% at 0% 0%, rgba(215,0,15,.10), transparent 60%),
            radial-gradient(90% 55% at 100% 100%, rgba(40,120,255,.14), transparent 60%),
            linear-gradient(165deg, #eef2f7 0%, #e4e9f1 55%, #ece6ea 100%);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b0d10;
  --card: #14171b;
  --ink: #eef1f4;
  --muted: #9aa4b0;
  --line: #252b32;
  --soft: #1b1f25;
  --accent: #ff6470;
  --sel: #2a1a1d;
  --field: #1a1e24;
  --key: #1d2229;
  --key-line: #2b323a;
  --glass: rgba(255,255,255,.08);
  --glass-hi: rgba(255,255,255,.16);
  --glass-line: rgba(255,255,255,.20);
  --glass-edge: rgba(255,255,255,.07);
  --glass-shadow: 0 4px 16px rgba(0,0,0,.45);
  --glass-tint: rgba(255,100,112,.20);
  --app-bg: radial-gradient(120% 60% at 0% 0%, rgba(215,0,15,.22), transparent 60%),
            radial-gradient(90% 55% at 100% 100%, rgba(50,110,255,.20), transparent 60%),
            linear-gradient(165deg, #0b0d10 0%, #0e1218 100%);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; }
input, button, select, textarea { font-size: max(16px, 1em); }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.4 "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", "Heiti TC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, .search:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
h2 { margin: 0; }

.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 版面骨架 ---------- */
.app {
  position: relative; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto;
  display: flex; flex-direction: column; background: var(--app-bg), var(--bg); box-shadow: 0 0 0 1px var(--line);
}
.top {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: calc(8px + var(--safe-t)) 8px 8px 16px; background: var(--card); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 800; font-size: 17px; letter-spacing: .02em; }
.brand .lite { margin-left: 6px; font: 700 13px var(--num); color: #fff; background: var(--red); border-radius: 4px; padding: 1px 6px; vertical-align: 1px; }
.top-r { display: flex; align-items: center; gap: 4px; }
.top time { font: 700 19px var(--num); color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .03em; }
.glass, .icon-btn, .pill, .chip, .key, .dir, .fake-field, .star {
  -webkit-backdrop-filter: blur(14px) saturate(1.6); backdrop-filter: blur(14px) saturate(1.6);
}
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); background: var(--glass); border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-hi); }
.icon-btn:active { background: var(--glass-hi); }

.main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; display: none; overflow-y: auto; overscroll-behavior: contain; }
.view.active { display: block; }
#view-search { overflow: hidden; }
#view-search.active { display: flex; flex-direction: column; }

.nav {
  flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  margin: 0 8px calc(6px + var(--safe-b)); padding: 4px; border-radius: 22px;
  background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(18px) saturate(1.7); backdrop-filter: blur(18px) saturate(1.7);
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
}
.nav button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 50px; border-radius: 18px; font-size: 11px; color: var(--muted); }
.nav .badge { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font: 700 10.5px/16px var(--num); text-align: center; }
.nav .ic { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 700; background: var(--glass-tint); box-shadow: inset 0 0 0 1px var(--glass-line), inset 0 1px 0 var(--glass-hi); }

/* ---------- 共用元件 ---------- */
.sec { padding: 16px 16px 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
.list { background: var(--card); border-block: 1px solid var(--line); }
.status { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; }
.status:empty { display: none; }
.note { margin: 0; padding: 10px 16px 0; font-size: 12.5px; color: var(--muted); }

.plate {
  flex: none; min-width: 58px; text-align: center; padding: 2px 8px 1px; border-radius: 6px;
  background: var(--red); color: #fff; font: 700 24px/1.2 var(--num); letter-spacing: .02em;
}
.plate.sm { min-width: 48px; font-size: 20px; }

.card { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.list > .card:last-child, .list > :last-child > .card:last-child { border-bottom: 0; }
.card:active { background: var(--soft); }
.card-text { flex: 1; min-width: 0; }
.card-text b { display: block; font-size: 15px; font-weight: 700; }
.card-text small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.chev { width: 18px; height: 18px; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 10px; }
.chip { padding: 3px 12px 2px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi); font: 700 18px/1.3 var(--num); letter-spacing: .03em; }
.chip:active { background: var(--glass-tint); }
.chip i { font: 600 11px var(--num); font-style: normal; color: var(--muted); margin-left: 4px; }

.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.pill:active { background: var(--glass-hi); }
.pill .ic { width: 16px; height: 16px; }
.pill[aria-pressed="true"] { color: var(--accent); background: var(--glass-tint); border-color: var(--accent); }
#routeFavBtn[aria-pressed="true"] .ic { fill: var(--amber); stroke: var(--amber); }

/* 到站時間：純文字，無外框。深色模式為白字，淺色模式自動改用深色字以免看不見 */
:root { --eta: var(--ink); }
:root[data-theme="dark"] { --eta: #fff; }
.led { flex: none; display: flex; align-items: baseline; justify-content: flex-end; gap: 2px; min-width: 64px; }
.led b { font: 700 26px/1 var(--num); color: var(--eta); font-variant-numeric: tabular-nums; }
.led small { font-size: 13px; color: var(--eta); }
.led.off b { color: var(--muted); font-weight: 600; }
.led.soon { min-width: 74px; }
.led.soon b { font: 800 16px/1.1 "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", system-ui, sans-serif; color: var(--accent); letter-spacing: .02em; animation: soon 1.6s ease-in-out infinite; }
.led.sm.soon { min-width: 64px; }
.led.sm.soon b { font-size: 14px; }
@keyframes soon { 50% { opacity: .45; } }
.led.sm { min-width: 52px; }
.led.sm b { font-size: 21px; }
.brand .beta { background: var(--muted); }

/* ---------- 首頁 ---------- */
.fake-field {
  display: flex; align-items: center; gap: 10px; width: calc(100% - 24px); margin: 12px 12px 4px; height: 50px; padding: 0 14px;
  border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi); color: var(--muted); font-size: 15px;
}
.credit { padding: 18px 16px 26px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }

/* ---------- 搜尋頁 ---------- */
.search-top { flex: none; padding: 10px 12px 8px; }
.field { position: relative; }
.field > .ic { position: absolute; left: 13px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.search {
  width: 100%; height: 48px; padding: 0 44px 0 42px; border-radius: 14px; border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  background: var(--glass); color: var(--ink); font: 700 26px var(--num); letter-spacing: .05em; text-transform: uppercase; caret-color: transparent;
}
.search::placeholder { font: 400 15px "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: var(--muted); }
.kb-open .search { border-color: var(--accent); }
.clear { position: absolute; right: 5px; top: 50%; translate: 0 -50%; width: 38px; height: 38px; display: grid; place-items: center; color: var(--muted); }

.suggest { display: flex; gap: 6px; padding: 0 12px 8px; overflow-x: auto; scrollbar-width: none; }
.suggest .chip { flex: none; }

.dirs { display: none; gap: 8px; padding: 0 12px 8px; }
.has-route .dirs { display: flex; }
.dir { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi); }
.dir span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dir-to { font-weight: 700; font-size: 14px; }
.dir-from { font-size: 11px; color: var(--muted); }
.dir.on { background: linear-gradient(180deg, rgba(235,40,55,.88), rgba(200,0,15,.82)); border-color: rgba(255,255,255,.35); color: #fff; }
.dir.on .dir-from { color: rgba(255,255,255,.88); }

.tools { display: none; align-items: center; gap: 6px; padding: 0 12px 8px; overflow-x: auto; scrollbar-width: none; }
.has-route .tools { display: flex; }
.updated { margin-left: auto; padding-left: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.updated.bad { color: var(--accent); font-weight: 700; }

.map-wrap {
  display: none; flex: none; height: clamp(230px, 38dvh, 400px); position: relative; margin: 0 12px 8px;
  border-radius: 18px; overflow: hidden; border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow);
  isolation: isolate; transition: height .25s ease;
}
.map-wrap.big { height: 64dvh; }
.map-ctl { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
.map-ctl button {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--ink);
  background: var(--glass-hi); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter: blur(14px) saturate(1.6); backdrop-filter: blur(14px) saturate(1.6);
}
.map-ctl button:active { background: var(--glass-tint); }
.map-ctl .sep { height: 2px; }
.map-legend {
  position: absolute; left: 10px; bottom: 10px; z-index: 1000; display: flex; gap: 10px; padding: 5px 11px; border-radius: 999px;
  background: var(--glass-hi); border: 1px solid var(--glass-line); font-size: 11.5px; font-weight: 600; pointer-events: none;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.has-route:not(.kb-open):not(.map-off):not(.no-map) .map-wrap { display: block; }
.no-map [data-act="toggle-map"] { display: none; }
#map { position: absolute; inset: 0; background: var(--soft); }
.leaflet-container { font-family: inherit; }
.leaflet-control-attribution { font-size: 9.5px !important; background: var(--glass-hi) !important; color: var(--muted) !important; border-radius: 8px 0 0 0; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.mk-wrap, .arr-wrap, .me-wrap { background: none; border: 0; }
.mk {
  width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2.5px solid var(--red); color: #a3000c;
  font: 700 12.5px/19px var(--num); text-align: center; box-shadow: 0 1px 5px rgba(0,0,0,.4); transition: transform .15s ease;
}
.mk.first { background: #16a34a; border-color: #fff; color: #fff; font-family: inherit; font-size: 11px; font-weight: 800; }
.mk.last { background: #15181d; border-color: #fff; color: #fff; font-family: inherit; font-size: 11px; font-weight: 800; }
.z-low .mk { transform: scale(.5); color: transparent; }
.z-low .mk.first, .z-low .mk.last { transform: scale(.85); color: #fff; }
.mk-wrap.sel .mk { transform: scale(1.4); background: var(--red); color: #fff; border-color: #fff; box-shadow: 0 0 0 4px rgba(215,0,15,.30), 0 2px 8px rgba(0,0,0,.45); }
.arr { width: 16px; height: 16px; font-size: 13px; line-height: 16px; text-align: center; color: var(--red); text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; }
.z-low .arr-wrap { display: none; }
.me { width: 18px; height: 18px; border-radius: 50%; background: #2b7bff; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(43,123,255,.28), 0 1px 4px rgba(0,0,0,.4); }
.leaflet-tooltip.stop-tip {
  background: var(--card); color: var(--ink); border: 1px solid var(--glass-line); border-radius: 12px; padding: 6px 10px;
  font: 700 13px/1.35 "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", system-ui, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.28);
  white-space: normal; max-width: 210px; text-align: center;
}
.leaflet-tooltip.stop-tip small { display: block; font-size: 12px; font-weight: 700; color: var(--accent); }
.leaflet-tooltip-top.stop-tip::before { border-top-color: var(--card); }

.search-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--card); border-top: 1px solid var(--line); }

/* 站牌時間線 */
.stop { position: relative; display: flex; border-bottom: 1px solid var(--line); }
.stop::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.stop:first-child::before { top: 50%; }
.stop:last-child::before { bottom: 50%; }
.stop.sel { background: var(--sel); }
.stop-main { flex: 1; min-width: 0; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; min-height: 62px; padding: 8px 6px 8px 0; }
.node {
  position: relative; justify-self: center; width: 24px; height: 24px; border-radius: 50%; background: var(--card);
  border: 2px solid var(--muted); display: grid; place-items: center; font-size: 11px; font-weight: 700; line-height: 1;
}
.stop.sel .node { background: var(--red); border-color: var(--red); color: #fff; }
.stop-text { min-width: 0; padding-right: 8px; }
.stop-name { display: block; font-weight: 600; font-size: 15px; }
.stop-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.stop-sub:empty { display: none; }
.star { flex: none; width: 40px; height: 40px; align-self: center; margin-right: 4px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: rgba(120,130,150,.10); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi); }
.star:active { background: var(--glass-tint); }
.star[data-act="alert-stop"][aria-pressed="true"] { color: var(--accent); background: var(--glass-tint); }
.star[data-act="alert-stop"][aria-pressed="true"] .ic { fill: currentColor; }
.star[aria-pressed="true"] { color: var(--amber); }
.star[aria-pressed="true"] .ic { fill: currentColor; }

/* ---------- 附近 / 收藏 ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; padding-right: 12px; }
.dist { flex: none; min-width: 62px; text-align: center; padding: 4px 6px 3px; border-radius: 6px; background: var(--panel); color: var(--led); font: 400 14px/1.2 "DotGothic16", ui-monospace, monospace; }
.nb-head[aria-expanded="true"] .chev { rotate: 90deg; }
.nb-body { background: var(--soft); border-bottom: 1px solid var(--line); }
.nb-body .card { padding: 10px 14px; }
.fav-row { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.fav-row .card { border-bottom: 0; }

/* ---------- 虛擬鍵盤 ---------- */
.kb { flex: none; display: none; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; background: transparent; border-top: 1px solid var(--glass-edge); }
.kb.open { display: grid; }
.kb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; align-content: start; }
.key {
  height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 12px;
  background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  font: 700 21px var(--num); letter-spacing: .03em; text-align: center;
}
.key:active { background: var(--glass-tint); }
.key:disabled { opacity: .25; cursor: default; }
.key.util { color: var(--muted); font: 600 13px "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", system-ui, sans-serif; }

/* ---------- 訊息與設定 ---------- */
.msg { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.msg:last-child { border-bottom: 0; }
.msg.unread { background: var(--sel); }
.msg-ic { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-tint); color: var(--accent); }
.msg-tx { min-width: 0; }
.msg-tx b { display: block; font-size: 14.5px; }
.msg-tx p { white-space: pre-line; margin: 2px 0 3px; font-size: 13px; line-height: 1.5; }
.msg-tx small { font-size: 11.5px; color: var(--muted); }
.head-row { display: flex; align-items: center; justify-content: space-between; padding-right: 12px; }
.head-row .acts { display: flex; gap: 6px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row b { display: block; font-size: 14.5px; }
.set-row small { display: block; margin-top: 1px; font-size: 12px; color: var(--muted); line-height: 1.45; }
.seg { display: flex; gap: 4px; flex: none; }
.seg .pill { padding: 5px 10px; }
.switch {
  flex: none; position: relative; width: 50px; height: 30px; border-radius: 15px; background: rgba(120,130,150,.32);
  border: 1px solid var(--glass-line); box-shadow: inset 0 1px 3px rgba(0,0,0,.2); transition: background .2s;
}
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--red); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.stat-grid div { padding: 12px 4px; }
.stat-grid b { display: block; font: 700 26px/1.1 var(--num); }
.stat-grid small { font-size: 11.5px; color: var(--muted); }
.disclaimer { margin: 0; padding: 8px 16px 14px; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
.danger { color: var(--accent); font-weight: 700; }

/* ---------- 載入 / 提示 ---------- */
.boot { position: absolute; inset: 0; z-index: 50; background: var(--bg); display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; color: var(--muted); }
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--red); animation: spin .8s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.toast {
  position: absolute; left: 50%; bottom: 14px; z-index: 60; translate: -50% 0; max-width: calc(100% - 32px);
  padding: 9px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }
.msg.urg { background: var(--sel); }
.msg.urg .msg-ic { background: var(--red); color: #fff; }
.urgbar { width: calc(100% - 24px); margin: 8px 12px 0; border-radius: 14px; background: var(--red); color: #fff; border: 0; }
.urgbar small, .urgbar .chev { color: rgba(255,255,255,.9); }
.status a { color: var(--accent); }
</style>
</head>

<div class="app" id="app">
  <header class="top">
    <div class="brand">九巴報站<span class="lite">Lite</span><span class="lite beta">內測版 0.1</span></div>
    <div class="top-r">
      <time id="clock">--:--</time>
      <button type="button" class="icon-btn" id="themeBtn" data-act="theme" aria-label="切換深色或淺色模式"><svg class="ic"><use href="#i-moon"/></svg></button>
    </div>
  </header>

  <main class="main">
    <!-- 首頁 -->
    <section id="view-home" class="view active" aria-label="首頁">
      <button type="button" class="fake-field" data-act="goto-search"><svg class="ic"><use href="#i-search"/></svg>輸入路線號碼，例如 1A、273A</button>
      <div id="homeUrg"></div>
      <div id="homeFav"></div>
      <div id="homeRecent"></div>
      <h2 class="sec">熱門路線</h2>
      <div id="homePopular" class="list"></div>
      <p class="credit">班次資料來自九巴開放數據（DATA.GOV.HK），預測到站時間只供參考，請以車站及巴士公司公佈為準。本網頁並非九巴官方服務。<br>版本：內測版 0.1</p>
    </section>

    <!-- 搜尋 -->
    <section id="view-search" class="view" aria-label="搜尋路線">
      <div class="search-top">
        <div class="field">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="routeInput" class="search" type="text" readonly inputmode="none" autocomplete="off" spellcheck="false" placeholder="輸入路線號碼" aria-label="路線號碼">
          <button type="button" class="clear" id="clearBtn" data-act="clear" aria-label="清除" hidden><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
      </div>
      <div class="suggest" id="suggest" hidden></div>
      <div class="dirs" id="dirTabs"></div>
      <div class="tools" id="tools">
        <button type="button" class="pill" id="routeFavBtn" data-act="fav-route" aria-pressed="false"><svg class="ic"><use href="#i-star"/></svg>收藏路線</button>
        <button type="button" class="pill" id="mapBtn" data-act="toggle-map" aria-pressed="true"><svg class="ic"><use href="#i-map"/></svg>地圖</button>

        <button type="button" class="pill" data-act="share"><svg class="ic"><use href="#i-share"/></svg>分享</button>
        <button type="button" class="pill" data-act="refresh" aria-label="重新整理"><svg class="ic"><use href="#i-refresh"/></svg></button>
        <span class="updated" id="updated"></span>
      </div>
      <div class="map-wrap" id="mapWrap">
        <div id="map"></div>
        <div class="map-ctl">
          <button type="button" data-act="map-big" id="mapBigBtn" aria-label="放大或縮小地圖區域"><svg class="ic"><use href="#i-expand"/></svg></button>
          <button type="button" data-act="map-fit" aria-label="顯示全線"><svg class="ic"><use href="#i-fit"/></svg></button>
          <button type="button" data-act="map-locate" aria-label="我的位置"><svg class="ic"><use href="#i-locate"/></svg></button>

          <button type="button" data-act="map-zin" aria-label="拉近"><svg class="ic"><use href="#i-plus"/></svg></button>

    <button type="button" data-act="tab" data-tab="msg"><svg class="ic"><use href="#i-msg"/></svg>訊息<span class="badge" id="msgBadge" hidden>0</span></button>

<script>
(() => {
'use strict';

/* ========== 常數與工具 ========== */
const API = 'https://data.etabus.gov.hk/v1/transport/kmb';
const REFRESH_MS = 30000;
const TICK_MS = 10000;
const NEAR_M = 500;
const SNAP_MAX = 30;      // 最多監察的路線方向數目（比對改線及站位轉移）
const WALK_M_PER_MIN = 75; // 步行速度約 75 米/分鐘
const POPULAR = ['1A', '273A', '270B', '78B', '276B', '960'];
const RED = '#d7000f';
const TILES = {
  light: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hms = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 私隱模式等情況下略過 */ } }
};

async function fetchJSON(url, fresh = false) {
  const res = await fetch(url, { ...(fresh ? { cache: 'no-store' } : {}), signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/* ========== 狀態 ========== */
const normalizeFavs = raw => (Array.isArray(raw) ? raw : [])
  .filter(f => f && f.route)
  .map(f => f.t ? f : { t: 'r', route: f.route, bound: f.bound, service_type: String(f.service_type) });

const S = {
  ready: false, tab: 'home',
  stops: {}, routes: [], routeMap: new Map(), routeNos: [],
  cur: null, dirs: [], curStops: [], etaBySeq: {}, selSeq: null, updatedAt: null,
  stopCache: new Map(), offset: 0, reqId: 0,
  favs: normalizeFavs(store.get('kmb_favorites', [])),
  recent: [].concat(store.get('kmb_recent', [])).filter(x => typeof x === 'string'),
  favEta: {}, favReq: 0,
  nbOpen: null, nbData: null, nbReq: 0,
  theme: store.get('kmb_theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
  mapOn: store.get('kmb_map', true),
  tRefresh: null, tTick: null, searchTimer: null,
  markers: new Map(), needFit: false, pos: null, alerts: new Map(store.get('kmb_alerts', [])), tAlert: null, mapBig: false,
  cfg: Object.assign({ alertMin: 3, wake: false, lang: 'tc', op: 50 }, store.get('kmb_cfg', {})),
  msgs: [].concat(store.get('kmb_msgs', [])).filter(m => m && m.title)
};

let map = null, layer = null, userLayer = null, tileLayer = null;
S.urg = []; S.urgErr = false; S.urgAt = null;
const view = $('#view-search');
const input = $('#routeInput');
const kb = $('#kb');

/* ========== 路線資料 ========== */
const findEntry = (route, bound, st) =>
  S.routes.find(r => r.route === route && r.bound === bound && (!st || r.service_type === String(st)));

function indexRoutes(list) {
  const idx = new Map();
  for (const r of list) {
    const e = idx.get(r.route) || {};
    const old = e[r.bound];
    if (!old || Number(r.service_type) < Number(old.service_type)) e[r.bound] = r;
    idx.set(r.route, e);
  }
  S.routeMap = idx;
  S.routeNos = [...idx.keys()].sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));
}

function dirsFor(routeNo, pick) {
  const m = S.routeMap.get(routeNo) || {};
  const dirs = ['O', 'I'].map(b => m[b]).filter(Boolean);
  if (pick && !dirs.includes(pick)) {
    const i = dirs.findIndex(d => d.bound === pick.bound);
    if (i > -1) dirs[i] = pick; else dirs.push(pick);
  }
  return dirs;
}

/* ========== 到站時間計算 ========== */
const packEta = it => {
  const t = it.eta ? Date.parse(it.eta) : NaN;
  return { ts: Number.isFinite(t) ? t : null, rmk: L(it, 'rmk') };
};

function groupEta(items, dir) {
  const by = {};
  for (const it of items) if (it.dir === dir) (by[it.seq] ||= []).push(it);
  for (const k in by) by[k] = by[k].sort((a, b) => a.eta_seq - b.eta_seq).map(packEta);
  return by;
}

// 以伺服器時間為準，避免用戶手機時鐘不準確而令分鐘數出錯
function setOffset(json) {
  const g = Date.parse(json && json.generated_timestamp);
  if (Number.isFinite(g)) S.offset = g - Date.now();
}

function minsOf(ts) {
  const diff = ts - (Date.now() + S.offset);
  if (diff < -60000) return null;
  return Math.max(0, Math.floor(diff / 60000));
}

function etaView(list) {
  const live = (list || []).map(e => ({ m: e.ts ? minsOf(e.ts) : null, rmk: e.rmk })).filter(e => e.m !== null);
  if (!live.length) {
    const rmk = (list || []).find(e => e.rmk);
    return { num: '--', unit: '', off: true, sub: rmk ? rmk.rmk : '暫無班次' };
  }
  const later = live.slice(1).map(e => (e.m === 0 ? '即將' : String(e.m)));
  const parts = [];
  if (live[0].rmk) parts.push(live[0].rmk);
  if (later.length) parts.push(`之後 ${later.join('、')}${later.some(x => x !== '即將') ? ' 分鐘' : ''}`);
  const soon = live[0].m === 0;
  return { num: soon ? '即將到達' : String(live[0].m), unit: soon ? '' : '分鐘', off: false, soon, sub: parts.join('，'), first: live[0].m };
}

// 更新到站時間顯示：統一處理「即將到達」「暫無班次」等狀態
function setLed(led, v) {
  led.classList.toggle('off', !!v.off);
  led.classList.toggle('soon', !!v.soon);
  $('[data-num]', led).textContent = v.num;
  $('[data-unit]', led).textContent = v.unit;
}

/* ========== 收藏 / 最近查看 ========== */
const favMatch = (a, b) => a.t === b.t && a.route === b.route && a.bound === b.bound &&
  String(a.service_type) === String(b.service_type) && (a.t === 'r' || (a.stop === b.stop && a.seq === b.seq));
const favIndex = f => S.favs.findIndex(x => favMatch(x, f));
const favKey = f => [f.route, f.bound, f.service_type, f.stop, f.seq].join('|');

function toggleFav(f) {
  const i = favIndex(f);
  if (i > -1) S.favs.splice(i, 1); else S.favs.push(f);
  store.set('kmb_favorites', S.favs);
  return i === -1;
}

function addRecent(route) {
  S.recent = [route, ...S.recent.filter(r => r !== route)].slice(0, 8);
  store.set('kmb_recent', S.recent);
}

/* ========== 共用畫面 ========== */
const routeCard = (r, act = 'go-route') => `
  <button type="button" class="card" data-act="${act}" data-route="${esc(r.route)}" data-bound="${esc(r.bound)}" data-st="${esc(r.service_type)}">
    <span class="plate">${esc(r.route)}</span>
    <span class="card-text"><b>往 ${esc(r.dest)}</b><small>由 ${esc(r.orig)} 開出</small></span>
    ${ic('chev', 'chev')}
  </button>`;

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function updateClock() {
  const d = new Date();
  $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function applyTheme(t) {
  S.theme = t;
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.content = t === 'dark' ? '#14171b' : '#ffffff';
  store.set('kmb_theme', t);
  applyGlass();
  setTiles();
}

/* ========== 首頁 ========== */
function renderHome() {
  renderHomeUrg();
  const rec = S.recent.filter(r => S.routeMap.has(r));
  $('#homeRecent').innerHTML = rec.length
    ? `<h2 class="sec">最近查看</h2><div class="chips">${rec.map(r => `<button type="button" class="chip" data-act="go-route" data-route="${esc(r)}">${esc(r)}</button>`).join('')}</div>`
    : '';
  const fs = S.favs.filter(f => f.t === 's');
  $('#homeFav').innerHTML = fs.length ? `<h2 class="sec">收藏站牌 · 即時</h2><div class="list">${fs.map(favStopRow).join('')}</div>` : '';
  $('#homePopular').innerHTML = POPULAR.map(n => S.routeMap.get(n)).filter(Boolean).map(m => routeCard(m.O || m.I)).join('');
  if (fs.length && S.ready) { paintFavEtas(); refreshFavs(); }
}

/* ========== 虛擬鍵盤與輸入 ========== */
function buildKeyboard() {
  const letters = [...new Set(S.routeNos.join('').replace(/\d/g, ''))].sort();
  const key = k => `<button type="button" class="key" data-act="key" data-key="${k}">${k}</button>`;
  $('#kbNums').innerHTML = '123456789'.split('').map(key).join('') +
    `<button type="button" class="key util" data-act="hide-kb" aria-label="收起鍵盤">${ic('down')}</button>` + key('0') +
    `<button type="button" class="key util" data-act="del" aria-label="刪除">${ic('back')}</button>`;
  $('#kbLetters').innerHTML = letters.map(key).join('') +
    `<button type="button" class="key util" data-act="clear">清空</button>`;
}

function nextChars(prefix) {
  const set = new Set();
  for (const n of S.routeNos) if (n.length > prefix.length && n.startsWith(prefix)) set.add(n[prefix.length]);
  return set;
}

// 只開放「有可能組成有效路線」的按鍵，減少輸入錯誤
function updateKeys() {
  const next = nextChars(input.value);
  $$('#kb [data-key]').forEach(b => { b.disabled = S.ready && !next.has(b.dataset.key); });
}

function showKeyboard() {
  if (S.tab !== 'search') return;
  kb.classList.add('open');
  view.classList.add('kb-open');
}
function hideKeyboard() {
  kb.classList.remove('open');
  view.classList.remove('kb-open');
}

function syncField() { $('#clearBtn').hidden = !input.value; }

function typeKey(c) {
  if (!S.ready || !nextChars(input.value).has(c)) return;
  input.value += c;
  onInput();
}
function deleteKey() { input.value = input.value.slice(0, -1); onInput(); }
function clearKey() { input.value = ''; onInput(true); }
function setInput(v) { input.value = v; onInput(true); }

function onInput(immediate = false) {
  clearTimeout(S.searchTimer);
  syncField();
  updateKeys();
  const v = input.value;
  if (!v) { showIdle(); return; }
  if (immediate) runSearch(v);
  else S.searchTimer = setTimeout(() => runSearch(v), 200); // 防抖：連續按鍵只查最後一次
}

/* ========== 搜尋 ========== */
function resetRouteUI() {
  S.reqId++;
  S.cur = null; S.curStops = []; S.etaBySeq = {}; S.selSeq = null;
  view.classList.remove('has-route');
  $('#dirTabs').innerHTML = '';
  $('#stopList').innerHTML = '';
  const c = $('#cands'); c.innerHTML = ''; c.hidden = true;
  $('#status').innerHTML = '';
  $('#updated').textContent = '';
  if (layer) layer.clearLayers();
  S.markers.clear();
  syncTimers();
}

function renderSuggest(list) {
  const el = $('#suggest');
  el.hidden = !list.length;
  el.innerHTML = list.slice(0, 30).map(n => `<button type="button" class="chip" data-act="pick-route" data-route="${esc(n)}">${esc(n)}</button>`).join('');
}

function showIdle() {
  resetRouteUI();
  renderSuggest([]);
  const rec = S.recent.filter(r => S.routeMap.has(r));
  $('#status').innerHTML = '請用下方鍵盤輸入路線號碼';
  if (rec.length) {
    const c = $('#cands');
    c.hidden = true;
    $('#status').innerHTML = `請用下方鍵盤輸入路線號碼
      <div class="chips" style="justify-content:center;padding-top:14px">${rec.map(r => `<button type="button" class="chip" data-act="pick-route" data-route="${esc(r)}">${esc(r)}</button>`).join('')}</div>`;
  }
}

function runSearch(v) {
  if (!S.ready || !v) return;
  const entry = S.routeMap.get(v);
  const others = S.routeNos.filter(n => n !== v && n.startsWith(v));
  renderSuggest(entry ? others : []);
  if (entry) {
    if (S.cur && S.cur.route === v && S.curStops.length) return;
    openRoute(entry.O || entry.I);
  } else if (others.length) {
    resetRouteUI();
    const c = $('#cands');
    c.hidden = false;
    c.innerHTML = others.slice(0, 40).map(n => { const m = S.routeMap.get(n); return routeCard(m.O || m.I, 'pick-route'); }).join('');
  } else {
    resetRouteUI();
    $('#status').textContent = `找不到路線 ${v}`;
  }
}

function openRoute(entry, opt = {}) {
  S.dirs = dirsFor(entry.route, entry);
  renderDirTabs(entry);
  view.classList.add('has-route');
  $('#cands').hidden = true;
  addRecent(entry.route);
  loadRoute(entry, { seq: opt.seq });
}

function renderDirTabs(active) {
  $('#dirTabs').innerHTML = S.dirs.map(d => {
    const on = d.bound === active.bound && d.service_type === active.service_type;
    return `<button type="button" class="dir ${on ? 'on' : ''}" data-act="pick-dir" data-bound="${esc(d.bound)}" data-st="${esc(d.service_type)}" aria-pressed="${on}">
      <span class="dir-to">往 ${esc(d.dest)}</span><span class="dir-from">由 ${esc(d.orig)}</span></button>`;
  }).join('');
}

function goRoute(route, bound, opt = {}) {
  if (!S.ready) return;
  const m = S.routeMap.get(route);
  if (!m) return;
  const entry = findEntry(route, bound, opt.st) || m[bound] || m.O || m.I;
  switchTab('search', { quiet: true });
  input.value = route;
  syncField();
  hideKeyboard();
  updateKeys();
  renderSuggest([]);
  openRoute(entry, { seq: opt.seq });
}

/* ========== 載入路線班次 ========== */
async function loadRoute(r, { seq = null, silent = false } = {}) {
  const id = silent ? S.reqId : ++S.reqId; // 背景更新不會作廢載入中的請求
  const st = $('#status');

  if (!silent) {
    S.cur = r; S.selSeq = seq; S.curStops = []; S.etaBySeq = {};
    $('#stopList').innerHTML = '';
    $('#updated').textContent = '';
    st.textContent = '載入班次中…';
    syncRouteStar();
  }

  try {
    const [stops, eta] = await Promise.all([getStops(r), fetchJSON(`${API}/route-eta/${r.route}/${r.service_type}`, true)]);
    if (id !== S.reqId) return;
    const full = !silent || !S.curStops.length;

    setOffset(eta);
    S.etaBySeq = groupEta(eta.data || [], r.bound);
    collectRemarks(r, eta.data || [], stops);
    S.updatedAt = new Date();
    const up = $('#updated');
    up.textContent = `更新於 ${hms(S.updatedAt)}`;
    up.classList.remove('bad');

    if (full) {
      S.curStops = stops;
      trackStops(r, stops);
      st.textContent = '';
      renderStopList();
      drawRoute();
      if (seq) selectStop(seq, { scroll: true });
      syncTimers();
    }
    paintEtas();
  } catch (err) {
    if (id !== S.reqId) return;
    console.error(err);
    if (silent) {
      const up = $('#updated');
      up.textContent = '更新失敗';
      up.classList.add('bad');
    } else {
      st.innerHTML = `載入失敗，請檢查網絡連線<br><button type="button" class="pill" style="margin-top:10px" data-act="retry">重試</button>`;
    }
  }
}

function getStops(r) {
  const key = `${r.route}|${r.bound}|${r.service_type}`;
  if (S.stopCache.has(key)) return Promise.resolve(S.stopCache.get(key));
  return fetchJSON(`${API}/route-stop/${r.route}/${r.bound === 'O' ? 'outbound' : 'inbound'}/${r.service_type}`).then(j => {
    const arr = j.data.map(x => ({ seq: Number(x.seq), id: x.stop, info: S.stops[x.stop] || null })).sort((a, b) => a.seq - b.seq);
    S.stopCache.set(key, arr);
    return arr;
  });
}

function refreshSearch() { if (S.cur) loadRoute(S.cur, { silent: true }); }

function renderStopList() {
  $('#stopList').innerHTML = S.curStops.map(s => `
    <div class="stop" data-seq="${s.seq}">
      <button type="button" class="stop-main" data-act="pick-stop" data-seq="${s.seq}">
        <span class="node">${s.seq}</span>
        <span class="stop-text"><span class="stop-name">${esc(s.info ? s.info.name : '（未知車站）')}</span><span class="stop-sub" data-sub></span></span>
        <span class="led off"><b data-num>--</b><small data-unit></small></span>
      </button>
      <button type="button" class="star" data-act="fav-stop" data-seq="${s.seq}" aria-pressed="false" aria-label="收藏此站">${ic('star')}</button>
      <button type="button" class="star" data-act="alert-stop" data-seq="${s.seq}" aria-pressed="false" aria-label="到站提醒">${ic('bell')}</button>
    </div>`).join('');
  syncStars();
}

function paintEtas() {
  checkAlerts();
  for (const row of $$('#stopList .stop')) {
    const v = etaView(S.etaBySeq[row.dataset.seq]);
    setLed($('.led', row), v);
    const walk = Number(row.dataset.seq) === S.selSeq ? walkNote(S.curStops.find(x => x.seq === S.selSeq), v) : '';
    $('[data-sub]', row).textContent = [v.sub, walk].filter(Boolean).join('，');
  }
  updateSelTip();
}

function syncStars() {
  if (!S.cur) return;
  for (const row of $$('#stopList .stop')) {
    const s = S.curStops.find(x => x.seq === Number(row.dataset.seq));
    if (!s) continue;
    const on = favIndex({ t: 's', route: S.cur.route, bound: S.cur.bound, service_type: S.cur.service_type, stop: s.id, seq: s.seq }) > -1;
    $('.star', row).setAttribute('aria-pressed', on);
  }
  syncBells();
}

function syncRouteStar() {
  const btn = $('#routeFavBtn');
  const on = !!S.cur && favIndex({ t: 'r', route: S.cur.route, bound: S.cur.bound, service_type: S.cur.service_type }) > -1;
  btn.setAttribute('aria-pressed', on);
  btn.lastChild.textContent = on ? '已收藏' : '收藏路線';

/* ========== 地圖 ========== */
function ensureMap() {
  if (map) return true;
  if (!window.L) { view.classList.add('no-map'); return false; }
  map = L.map('map', { zoomControl: false, attributionControl: true }).setView([22.3193, 114.1694], 12);
  map.attributionControl.setPrefix(false);
  layer = L.featureGroup().addTo(map);
  userLayer = L.layerGroup().addTo(map);
  setTiles();
  map.on('zoomend', syncZoomClass);
  syncZoomClass();
  if (window.ResizeObserver) {
    new ResizeObserver(() => { map.invalidateSize(); tryFit(); refreshTip(); }).observe($('#mapWrap'));
  }
  return true;
}

// 拉遠時把站點縮成小圓點、隱藏方向箭嘴，避免畫面過亂
function syncZoomClass() { $('#map').classList.toggle('z-low', map.getZoom() < 15); }

function setTiles() {
  if (!map) return;
  if (tileLayer) map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(TILES[S.theme], { maxZoom: 19, subdomains: 'abcd', detectRetina: true, attribution: '© OpenStreetMap © CARTO' }).addTo(map);
}

const mapShown = () => $('#mapWrap').offsetHeight > 0;

function tryFit() {
  if (!S.needFit || !map || !mapShown()) return;
  const pts = S.curStops.filter(s => s.info).map(s => [s.info.lat, s.info.lng]);
  if (!pts.length) return;
  map.invalidateSize();
  map.fitBounds(pts, { padding: [36, 36] });
  S.needFit = false;
}

const bearing = (a, b) => {
  const r = Math.PI / 180, dl = (b.lng - a.lng) * r;
  const y = Math.sin(dl) * Math.cos(b.lat * r);
  const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
};

function drawRoute() {
  if (!ensureMap()) return;
  layer.clearLayers();
  S.markers.clear();
  const valid = S.curStops.filter(s => s.info);
  if (!valid.length) return;
  const pts = valid.map(s => [s.info.lat, s.info.lng]);
  // 白色外框 + 紅色路線，令路線在任何地圖底色上都清楚
  L.polyline(pts, { color: '#ffffff', weight: 10, opacity: .95, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(layer);
  L.polyline(pts, { color: RED, weight: 5, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(layer);
  // 行車方向箭嘴
  for (let i = 0; i < valid.length - 1; i++) {
    const a = valid[i].info, b = valid[i + 1].info;
    if (dist(a.lat, a.lng, b.lat, b.lng) < 120) continue;
    L.marker([(a.lat + b.lat) / 2, (a.lng + b.lng) / 2], {
      icon: L.divIcon({ className: 'arr-wrap', html: `<div class="arr" style="transform:rotate(${bearing(a, b).toFixed(0)}deg)">▲</div>`, iconSize: [16, 16], iconAnchor: [8, 8] }),
      interactive: false, keyboard: false
    }).addTo(layer);
  }
  const first = valid[0].seq, last = valid[valid.length - 1].seq;
  valid.forEach(s => {
    const cls = s.seq === first ? 'first' : s.seq === last ? 'last' : '';
    const lab = s.seq === first ? '起' : s.seq === last ? '終' : s.seq;
    const m = L.marker([s.info.lat, s.info.lng], {
      icon: L.divIcon({ className: 'mk-wrap', html: `<div class="mk ${cls}">${lab}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] }),
      keyboard: false, riseOnHover: true
    });
    m.on('click', () => selectStop(s.seq, { scroll: true }));
    m.addTo(layer);
    S.markers.set(s.seq, m);
  });
  S.needFit = true;
  tryFit();
  styleMarkers();
  drawUser();
}

function selTipHtml(seq) {
  const s = S.curStops.find(x => x.seq === seq);
  if (!s) return '';
  const v = etaView(S.etaBySeq[seq]);
  const t = v.off ? v.sub : (v.soon ? '即將到達' : `${v.num} 分鐘`);
  return `${esc(s.info ? s.info.name : '車站')}<small>${esc(t)}</small>`;
}

function styleMarkers() {
  S.markers.forEach((m, seq) => {
    const sel = seq === S.selSeq;
    const el = m.getElement();
    if (el) el.classList.toggle('sel', sel);
    m.setZIndexOffset(sel ? 2000 : 0);
    if (sel) m.bindTooltip(selTipHtml(seq), { permanent: true, direction: 'top', offset: [0, -18], className: 'stop-tip' }).openTooltip();
    else if (m.getTooltip()) m.unbindTooltip();
  });
}

function updateSelTip() {
  const m = S.selSeq != null && S.markers.get(S.selSeq);
  if (m && m.getTooltip()) m.setTooltipContent(selTipHtml(S.selSeq));
}

function refreshTip() {
  const m = S.selSeq != null && S.markers.get(S.selSeq);
  if (m && m.getTooltip() && mapShown()) { m.closeTooltip(); m.openTooltip(); }
}

function drawUser() {
  if (!map || !userLayer || !S.pos) return;
  userLayer.clearLayers();
  L.marker([S.pos.lat, S.pos.lng], {
    icon: L.divIcon({ className: 'me-wrap', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
    interactive: false, keyboard: false, zIndexOffset: 500
  }).addTo(userLayer);
}

function toggleMapBig() {
  S.mapBig = !S.mapBig;
  $('#mapWrap').classList.toggle('big', S.mapBig);
  $('#mapBigBtn').innerHTML = ic(S.mapBig ? 'shrink' : 'expand');
  setTimeout(() => { if (map) { map.invalidateSize(); refreshTip(); } }, 280);
}

async function locateMe() {
  if (!ensureMap()) return;
  try {
    const { coords } = await getPos();
    S.pos = { lat: coords.latitude, lng: coords.longitude };
    drawUser();
    map.setView([S.pos.lat, S.pos.lng], Math.max(map.getZoom(), 16), { animate: !reduceMotion });
    paintEtas();
    toast('已顯示你的位置');
  } catch (e) { toast(geoMsg(e)); }
}

function setMapOn(on) {
  S.mapOn = on;
  view.classList.toggle('map-off', !on);
  $('#mapBtn').setAttribute('aria-pressed', on);
  store.set('kmb_map', on);
}

function selectStop(seq, { scroll = false } = {}) {
  S.selSeq = seq;
  hideKeyboard();
  $$('#stopList .stop').forEach(r => r.classList.toggle('sel', Number(r.dataset.seq) === seq));
  styleMarkers();
  paintEtas();
  const s = S.curStops.find(x => x.seq === seq);
  if (map && s && s.info && mapShown()) {
    S.needFit = false;
    map.invalidateSize();
    map.setView([s.info.lat, s.info.lng], Math.max(map.getZoom(), 16), { animate: !reduceMotion });
  }
  if (scroll) {
    const row = $(`#stopList .stop[data-seq="${seq}"]`);
    if (row) row.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
  }
}

/* ========== 定位 ========== */
const dist = (a, b, c, d) => {
  const R = 6371e3, r = Math.PI / 180;
  const dLat = (c - a) * r, dLng = (d - b) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
};

function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('nogeo'));
    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
  });
}

function geoMsg(e) {
  if (!navigator.geolocation) return '此瀏覽器不支援定位功能。';
  if (!window.isSecureContext) return '定位功能需要在 https 或 localhost 環境下使用。';
  if (e && e.code === 1) return '未能讀取位置，請在瀏覽器設定中允許此網站使用定位。';
  return '暫時無法取得位置，請到空曠的地方再試一次。';
}

async function nearestOnRoute() {
  if (!S.cur || !S.curStops.length) return;
  try {
    const { coords } = await getPos();
    S.pos = { lat: coords.latitude, lng: coords.longitude };
    drawUser();
    let best = null;
    for (const s of S.curStops) {
      if (!s.info) continue;
      const d = dist(coords.latitude, coords.longitude, s.info.lat, s.info.lng);
      if (!best || d < best.d) best = { s, d };
    }
    if (!best) return;
    selectStop(best.s.seq, { scroll: true });
    toast(`最近的站：${best.s.info.name}（約 ${Math.round(best.d)} 米）`);
  } catch (e) {
    toast(geoMsg(e));
  }
}

/* ========== 附近車站 ========== */
async function renderNearby() {
  if (!S.ready) return;
  const body = $('#nbBody');
  const id = ++S.nbReq;
  S.nbOpen = null; S.nbData = null;
  body.innerHTML = '<p class="status">正在取得你的位置…</p>';
  try {
    const { coords } = await getPos();
    if (id !== S.nbReq) return;
    S.pos = { lat: coords.latitude, lng: coords.longitude };
    const all = Object.entries(S.stops)
      .map(([sid, s]) => ({ id: sid, name: s.name, d: dist(coords.latitude, coords.longitude, s.lat, s.lng) }))
      .filter(s => Number.isFinite(s.d))
      .sort((a, b) => a.d - b.d);
    let near = all.filter(s => s.d <= NEAR_M).slice(0, 15);
    let note = `${NEAR_M} 米內共 ${near.length} 個車站，點選車站查看即時班次。`;
    if (!near.length) { near = all.slice(0, 5); note = `${NEAR_M} 米內沒有巴士站，以下為最近的 5 個車站。`; }
    body.innerHTML = `<p class="note">${note}</p><div class="list" style="margin-top:10px">${near.map(nbCard).join('')}</div>`;
  } catch (e) {
    if (id !== S.nbReq) return;
    body.innerHTML = `<div class="status">${esc(geoMsg(e))}</div>`;
  }
  syncTimers();
}

const nbCard = s => `
  <div class="nb" data-stop="${esc(s.id)}">
    <button type="button" class="card nb-head" data-act="toggle-stop" data-stop="${esc(s.id)}" aria-expanded="false">
      <span class="dist">${Math.round(s.d)} 米</span>
      <span class="card-text"><b>${esc(s.name)}</b></span>
      ${ic('chev', 'chev')}
    </button>
    <div class="nb-body" hidden></div>
  </div>`;

const nbBox = id => $$('.nb').find(b => b.dataset.stop === id);

function closeNb() {
  const box = S.nbOpen && nbBox(S.nbOpen);
  if (box) { $('.nb-head', box).setAttribute('aria-expanded', 'false'); $('.nb-body', box).hidden = true; }
  S.nbOpen = null; S.nbData = null;
}

function toggleNb(id) {
  const same = S.nbOpen === id;
  closeNb();
  if (!same) {
    S.nbOpen = id;
    const box = nbBox(id);
    $('.nb-head', box).setAttribute('aria-expanded', 'true');
    const body = $('.nb-body', box);
    body.hidden = false;
    body.innerHTML = '<p class="status">載入班次中…</p>';
    loadNb(id);
  }
  syncTimers();
}

async function loadNb(id) {
  try {
    const json = await fetchJSON(`${API}/stop-eta/${id}`, true);
    if (S.nbOpen !== id) return;
    setOffset(json);
    const g = new Map();
    for (const it of json.data || []) {
      const k = `${it.route}|${it.dir}|${it.service_type}|${it.seq}`;
      if (!g.has(k)) g.set(k, []);
      g.get(k).push(it);
    }
    const rows = [...g.values()].map(list => {
      list.sort((a, b) => a.eta_seq - b.eta_seq);
      const f = list[0];
      return { route: f.route, dir: f.dir, st: String(f.service_type), seq: Number(f.seq), dest: L(f, 'dest'), etas: list.map(packEta) };
    }).sort((a, b) => a.route.localeCompare(b.route, 'en', { numeric: true }) || a.dir.localeCompare(b.dir));
    S.nbData = { id, rows };
    paintNb();
  } catch (err) {
    if (S.nbOpen !== id) return;
    console.error(err);
    const box = nbBox(id);
    if (box) $('.nb-body', box).innerHTML = '<p class="status">載入失敗，請稍後再試</p>';
  }
}

function paintNb() {
  const d = S.nbData;
  const box = d && nbBox(d.id);
  if (!box) return;
  $('.nb-body', box).innerHTML = d.rows.length
    ? d.rows.map(r => {
        const v = etaView(r.etas);
        return `<button type="button" class="card" data-act="go-route" data-route="${esc(r.route)}" data-bound="${esc(r.dir)}" data-st="${esc(r.st)}" data-seq="${r.seq}">
          <span class="plate sm">${esc(r.route)}</span>
          <span class="card-text"><b>往 ${esc(r.dest)}</b><small>${esc(v.sub)}</small></span>
          <span class="led sm ${v.off ? 'off' : ''} ${v.soon ? 'soon' : ''}"><b>${esc(v.num)}</b><small>${esc(v.unit)}</small></span>
        </button>`;
      }).join('')
    : '<p class="status">此站暫時沒有班次資料</p>';
}

function refreshNearby() { if (S.nbOpen) loadNb(S.nbOpen); }

/* ========== 語言 / 按鈕透明度 / 通知 / 緊急消息 ========== */
let LANG = 'tc';

  if (LANG !== 'en') return s;
  const t = s.trim();
  if (EN[t]) return s.replace(t, EN[t]);
  return EN_RE.reduce((a, [re, f]) => a.replace(re, f), s);

const ORIG = new WeakMap();
function trNode(n) {
  if (n.nodeType === 3) {
    const o = ORIG.get(n) ?? n.nodeValue;
    if (!/[\u4e00-\u9fff]/.test(o)) return;
    ORIG.set(n, o);
    const v = tr(o);
    if (v !== n.nodeValue) n.nodeValue = v;
  } else if (n.nodeType === 1) {
    for (const a of ['placeholder', 'aria-label']) {
      const v = n.getAttribute(a);
      if (v == null) continue;
      const k = '_o' + a, o = n[k] ?? v;

      const t = tr(o);
      if (t !== v) n.setAttribute(a, t);
    }
  }
}

function notify(title, body, tag) {

// 運輸署「特別交通消息」，只保留與巴士有關的項目
const TD_URL = 'https://resource.data.one.gov.hk/td/en/specialtrafficnews.xml';
const BUS_RE = /巴士|九巴|\bbus(es)?\b|KMB/i;
const urgText = x => (LANG === 'en' && x.en) || x.tc;
async function fetchUrgent() {
  try {
    const res = await fetch(TD_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const doc = new DOMParser().parseFromString(await res.text(), 'text/xml');
    const g = (m, t) => { const e = m.getElementsByTagName(t)[0]; return e ? e.textContent.trim() : ''; };
    S.urg = [...doc.getElementsByTagName('message')].map(m => ({ id: g(m, 'msgID'), tc: g(m, 'ChinText'), en: g(m, 'EngText') }))
      .filter(x => x.id && BUS_RE.test(`${x.tc} ${x.en}`));
    S.urgAt = new Date(); S.urgErr = false;
    const seen = store.get('kmb_urg_seen', null); // 第一次只記錄，不會一次過彈出舊消息
    if (seen) for (const x of S.urg) if (!seen.includes(x.id)) {
      const t = urgText(x).split('\n').map(z => z.trim()).filter(Boolean);
      pushMsg('urgent', '緊急消息', t.join('\n').slice(0, 240), `urg|${x.id}`);
      notify('運輸署緊急消息', (t[0] || '').slice(0, 80), `urg|${x.id}`);
    }
    store.set('kmb_urg_seen', S.urg.map(x => x.id));
  } catch (err) { console.error(err); S.urgErr = true; }
  renderUrgent(); renderHomeUrg();
}

}

/* ========== 新功能：到站提醒、趕車提示、分享班次 ========== */
const alertKey = (r, seq) => `${r.route}|${r.bound}|${r.service_type}|${seq}`;

function toggleAlert(seq) {
  if (!S.cur) return;
  const k = alertKey(S.cur, seq);
  if (S.alerts.has(k)) { S.alerts.delete(k); toast('已取消到站提醒'); }
  else {
    const s = S.curStops.find(x => x.seq === seq);
    if (!s) return;
    S.alerts.set(k, { route: S.cur.route, bound: S.cur.bound, st: S.cur.service_type, stop: s.id, name: s.info ? s.info.name : '此站', seq, fired: false });
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    toast(`已設定：${S.cur.route} 剩 ${S.cfg.alertMin} 分鐘內提醒你（切換分頁也會提醒，請保持網頁開啟）`);
    checkAlerts();
  }
  saveAlerts();
  syncBells();
  syncAlertTimer();
}

// 有提醒時在背景定時查詢，切換到其他分頁也會通知
function syncAlertTimer() {
  clearInterval(S.tAlert); S.tAlert = null;
  if (S.alerts.size) S.tAlert = setInterval(pollAlerts, REFRESH_MS);
}

async function pollAlerts() {
  for (const a of [...S.alerts.values()]) {
    try {
      const j = await fetchJSON(`${API}/eta/${a.stop}/${a.route}/${a.st}`, true);
      setOffset(j);
      fireIfDue(a, groupEta(j.data || [], a.bound)[a.seq] || []);
    } catch { /* 下次再試 */ }
  }
}

function syncBells() {
  if (!S.cur) return;
  for (const row of $$('#stopList .stop')) {
    $('[data-act="alert-stop"]', row).setAttribute('aria-pressed', S.alerts.has(alertKey(S.cur, Number(row.dataset.seq))));
  }
}

function fireIfDue(a, list) {
  const first = list.map(e => e.ts ? minsOf(e.ts) : null).find(m => m !== null);
  if (first === undefined) return;
  if (first <= S.cfg.alertMin && !a.fired) {
    a.fired = true;
    const msg = first === 0 ? `${a.route} 即將到達「${a.name}」` : `${a.route} 約 ${first} 分鐘後到達「${a.name}」`;
    toast(msg);
    pushMsg('alert', '到站提醒', msg);
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    notify('九巴報站', msg, `eta|${a.route}|${a.seq}`); saveAlerts();
  } else if (first > S.cfg.alertMin + 2) a.fired = false; // 班次駛過後重新啟用
}

function checkAlerts() {
  if (!S.cur) return;
  for (const [k, a] of S.alerts) {
    if (!k.startsWith(`${S.cur.route}|${S.cur.bound}|${S.cur.service_type}|`)) continue;
    fireIfDue(a, S.etaBySeq[a.seq] || []);
  }
}

// 比較步行時間與巴士到站時間，預測趕不趕得上（需先按「最近的站」取得位置）
function walkNote(s, v) {
  if (!S.pos || !s || !s.info || v.off || v.first === undefined) return '';
  const d = dist(S.pos.lat, S.pos.lng, s.info.lat, s.info.lng);
  if (d > 3000) return '';
  const w = Math.max(1, Math.ceil(d / WALK_M_PER_MIN));
  return `步行約 ${w} 分鐘，${w <= v.first ? '趕得上' : '恐怕趕不及'}`;
}

async function shareEta() {
  if (!S.cur || !S.curStops.length) return;
  const s = S.curStops.find(x => x.seq === S.selSeq) || S.curStops[0];
  const v = etaView(S.etaBySeq[s.seq]);
  const text = `${S.cur.route} 往 ${S.cur.dest}｜${s.info ? s.info.name : '車站'}：${v.off ? v.sub : v.num + v.unit}`;
  try {
    if (navigator.share) await navigator.share({ text });
    else { await navigator.clipboard.writeText(text); toast('已複製班次資訊'); }
  } catch (e) { if (!e || e.name !== 'AbortError') toast('無法分享，請手動複製'); }
}

/* ========== 訊息中心 ========== */
const MSG_ICON = { route: 'map', stop: 'pin', note: 'msg', alert: 'bell', urgent: 'bell' };

function pushMsg(type, title, body, key) {
  if (key && S.msgs.some(m => m.k === key)) return;
  S.msgs.unshift({ ts: Date.now(), type, title, body, k: key || null, read: false });
  S.msgs = S.msgs.slice(0, 60);
  store.set('kmb_msgs', S.msgs);
  updateBadge();
  if (S.tab === 'msg') renderMsgs();
}

function updateBadge() {
  const n = S.msgs.filter(m => !m.read).length;
  const b = $('#msgBadge');
  b.hidden = !n;
  b.textContent = n > 9 ? '9+' : String(n);
}

function markRead() {
  S.msgs.forEach(m => { m.read = true; });
  store.set('kmb_msgs', S.msgs);
  updateBadge();
}

function ago(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '剛剛';
  if (m < 60) return `${m} 分鐘前`;
  if (m < 1440) return `${Math.floor(m / 60)} 小時前`;
  const d = new Date(ts);
  return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderMsgs() {
  $('#msgBody').innerHTML = S.msgs.length
    ? S.msgs.map(m => `<div class="msg ${m.read ? '' : 'unread'}"><span class="msg-ic">${ic(MSG_ICON[m.type] || 'msg')}</span>
        <div class="msg-tx"><b>${esc(m.title)}</b><p>${esc(m.body)}</p><small>${esc(ago(m.ts))}</small></div></div>`).join('')
    : '<div class="status">暫時沒有訊息。<br>你收藏或查看過的路線，如有終點站改動、<br>站位轉移或特別班次備註，會顯示在這裡。</div>';

let wakeLock = null;
async function setWake() {
  try {
    if (S.cfg.wake && !document.hidden) {
      if (!('wakeLock' in navigator)) { toast('此瀏覽器不支援螢幕常亮'); return; }

const r4 = n => Math.round(n * 1e4) / 1e4;

function trackStops(r, stops) {
  if (!stops || !stops.length) return;
  const snap = store.get('kmb_snap', {});
  const key = `${r.route}|${r.bound}|${r.service_type}`;
  const now = stops.map(s => [s.id, s.info ? s.info.n.tc : '', s.info ? r4(s.info.lat) : 0, s.info ? r4(s.info.lng) : 0]);
  if (snap[key]) diffStops(r, snap[key].s, now);
  snap[key] = { t: Date.now(), s: now };
  const keys = Object.keys(snap);
  if (keys.length > SNAP_MAX) keys.sort((a, b) => snap[a].t - snap[b].t).slice(0, keys.length - SNAP_MAX).forEach(k => { delete snap[k]; });
  store.set('kmb_snap', snap);
}

function diffStops(r, oldS, newS) {
  const oldM = new Map(oldS.map(x => [x[0], x]));
  const newM = new Map(newS.map(x => [x[0], x]));
  const items = [];
  for (const [id, n] of newM) {
    const o = oldM.get(id);
    if (!o) continue;
    if (o[1] !== n[1]) items.push(`「${o[1]}」改名為「${n[1]}」`);
    else if (o[2] && n[2]) {
      const d = dist(o[2], o[3], n[2], n[3]);
      if (d > 40) items.push(`「${n[1]}」站位移動約 ${Math.round(d)} 米`);
    }
  }
  const gone = oldS.filter(x => !newM.has(x[0]));
  const added = newS.filter(x => !oldM.has(x[0]));
  const used = new Set();
  for (const g of gone) {
    let best = null;
    for (const a of added) {
      if (used.has(a[0]) || !g[2] || !a[2]) continue;
      const d = dist(g[2], g[3], a[2], a[3]);
      if (d <= 400 && (!best || d < best.d)) best = { a, d };
    }
    if (best) { used.add(best.a[0]); items.push(`站位轉移：「${g[1]}」→「${best.a[1]}」（相距約 ${Math.round(best.d)} 米）`); }
    else items.push(`取消停靠：「${g[1]}」`);
  }
  for (const a of added) if (!used.has(a[0])) items.push(`新增停靠：「${a[1]}」`);
  if (!items.length) return;
  const body = items.slice(0, 5).join('；') + (items.length > 5 ? `…等共 ${items.length} 項` : '');
  pushMsg('stop', `${r.route} 往 ${r.dest}：站點有變`, body, `stop|${r.route}|${r.bound}|${items.join('|')}`.slice(0, 240));
}

const prettySig = sig => sig.split(';').filter(x => !x.endsWith(':-')).map(x => {
  const [, rest] = x.split(/:(.+)/);
  const [o, d] = rest.split('>');
  return `${o} → ${d}`;
}).join('；');

function trackRoutes() {
  const snap = store.get('kmb_snap_r', {});
  for (const rt of watchList()) {
    const m = S.routeMap.get(rt);
    const sig = m ? ['O', 'I'].map(b => (m[b] ? `${b}:${m[b].orig_tc}>${m[b].dest_tc}` : `${b}:-`)).join(';') : 'gone';
    const old = snap[rt];
    if (old && old !== sig) {
      if (sig === 'gone') pushMsg('route', `路線 ${rt} 已不在班次資料中`, '可能已取消或暫停服務，請向九巴查詢。', `route|${rt}|gone`);
      else if (old === 'gone') pushMsg('route', `路線 ${rt} 重新出現在班次資料中`, prettySig(sig), `route|${rt}|${sig}`);
      else pushMsg('route', `路線 ${rt} 起訖點有更新`, `原本：${prettySig(old)}\n現在：${prettySig(sig)}`, `route|${rt}|${sig}`);
    }
    snap[rt] = sig;
  }
  store.set('kmb_snap_r', snap);
}

async function checkWatched() {
  if (!S.ready) return;
  trackRoutes();
  for (const rt of watchList().slice(0, 6)) {
    const m = S.routeMap.get(rt);
    if (!m) continue;
    for (const b of ['O', 'I']) {
      if (!m[b]) continue;
      try { trackStops(m[b], await getStops(m[b])); } catch { /* 網絡問題，下次再比對 */ }
    }
  }
}

// 收集九巴在班次上的特別備註（例如尾班車、特別班次），每日每條路線同一備註只記一次
const NOISE = /^(原定班次|預定班次|預定|原定)$/;
function collectRemarks(r, items, stops) {
  const day = new Date().toDateString();
  const seen = new Set();
  for (const it of items) {
    const t = (it.rmk_tc || '').trim();
    if (!t || NOISE.test(t) || it.dir !== r.bound || seen.has(t)) continue;
    seen.add(t);
    const s = stops.find(x => x.seq === Number(it.seq));
    pushMsg('note', `${r.route} 往 ${r.dest}：${t}`, `九巴班次備註「${t}」${s && s.info ? `（例如 ${s.info.name} 一帶）` : ''}`, `note|${day}|${r.route}|${r.bound}|${t}`);
  }
}

/* ========== 收藏頁 ========== */
function renderFavs() {
  if (!S.ready) return;
  const el = $('#favBody');
  if (!S.favs.length) {
    el.innerHTML = '<div class="status">還沒有收藏。<br>在路線頁點「收藏路線」，<br>或點站名旁的星號收藏常用站牌。</div>';
    return;
  }
  const stops = S.favs.filter(f => f.t === 's');
  const routes = S.favs.filter(f => f.t === 'r');
  let html = '';
  if (stops.length) {
    html += `<h2 class="sec">常用站牌</h2><div class="list">${stops.map(favStopRow).join('')}</div>`;
  }
  if (routes.length) {
    html += `<h2 class="sec">收藏路線</h2><div class="list">${routes.map(f => {
      const r = findEntry(f.route, f.bound, f.service_type);
      return r ? `<div class="fav-row">${routeCard(r).replace('class="card"', 'class="card" style="flex:1"')}
        <button type="button" class="star" data-act="unfav" data-key="${esc(favKey(f))}" aria-pressed="true" aria-label="取消收藏">${ic('star')}</button></div>` : '';
    }).join('')}</div>`;
  }
  el.innerHTML = html;
  paintFavEtas();
  refreshFavs();
}

function favStopRow(f) {
  const r = findEntry(f.route, f.bound, f.service_type);
  if (!r) return '';
  const info = S.stops[f.stop];
  return `<div class="fav-row" data-key="${esc(favKey(f))}" data-dest="${esc(r.dest)}">
    <button type="button" class="card" style="flex:1;min-width:0" data-act="go-route" data-route="${esc(f.route)}" data-bound="${esc(f.bound)}" data-st="${esc(f.service_type)}" data-seq="${f.seq}">
      <span class="plate sm">${esc(f.route)}</span>
      <span class="card-text"><b>${esc(info ? info.name : '（未知車站）')}</b><small data-sub></small></span>
      <span class="led sm off"><b data-num>--</b><small data-unit></small></span>
    </button>
    <button type="button" class="star" data-act="unfav" data-key="${esc(favKey(f))}" aria-pressed="true" aria-label="取消收藏">${ic('star')}</button>
  </div>`;
}

function paintFavEtas() {
  for (const row of $$('#favBody .fav-row[data-dest], #homeFav .fav-row[data-dest]')) {
    const list = S.favEta[row.dataset.key];
    const v = list ? etaView(list) : { num: '--', unit: '', off: true, sub: '' };
    setLed($('.led', row), v);
    $('[data-sub]', row).textContent = ['往 ' + row.dataset.dest, v.sub].filter(Boolean).join('，');
  }
}

async function refreshFavs() {
  const stops = S.favs.filter(f => f.t === 's');
  if (!stops.length) return;
  const id = ++S.favReq;
  const res = await Promise.allSettled(stops.map(f => fetchJSON(`${API}/eta/${f.stop}/${f.route}/${f.service_type}`, true)));
  if (id !== S.favReq || (S.tab !== 'fav' && S.tab !== 'home')) return;
  res.forEach((r, i) => {
    if (r.status !== 'fulfilled') return;
    setOffset(r.value);
    S.favEta[favKey(stops[i])] = groupEta(r.value.data || [], stops[i].bound)[stops[i].seq] || [];
  });
  paintFavEtas();
}

/* ========== 分頁與計時器 ========== */
function switchTab(tab, { quiet = false } = {}) {
  S.tab = tab;
  $$('.view').forEach(v => v.classList.toggle('active', v.id === `view-${tab}`));
  $$('.nav button').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (tab !== 'search') hideKeyboard();

  if (tab === 'home') renderHome();
  else if (tab === 'fav') renderFavs();
  else if (tab === 'nearby') renderNearby();
  else if (tab === 'msg') { renderMsgs(); markRead(); }
  else if (tab === 'search' && !quiet) {
    if (!input.value) { showIdle(); showKeyboard(); }
    else if (S.cur) { syncStars(); syncRouteStar(); refreshSearch(); }
  }
  syncTimers();
}

function syncTimers() {
  clearInterval(S.tRefresh); clearInterval(S.tTick);
  S.tRefresh = S.tTick = null;
  const cfg = {
    search: S.cur && [refreshSearch, paintEtas],
    home: S.ready && S.favs.some(f => f.t === 's') && [refreshFavs, paintFavEtas],
    fav: [refreshFavs, paintFavEtas],
    nearby: S.nbOpen && [refreshNearby, paintNb]
  }[S.tab];
  if (!cfg) return;
  S.tRefresh = setInterval(() => { if (!document.hidden) cfg[0](); }, REFRESH_MS);
  S.tTick = setInterval(() => { if (!document.hidden) cfg[1](); }, TICK_MS);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden || !S.ready) return;
  if (S.tab === 'search') refreshSearch();
  else if (S.tab === 'fav') refreshFavs();
  else if (S.tab === 'nearby') refreshNearby();
});

/* ========== 事件 ========== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'tab': switchTab(d.tab); break;
    case 'goto-search': switchTab('search'); break;
    case 'go-route': goRoute(d.route, d.bound, { st: d.st, seq: d.seq ? Number(d.seq) : null }); break;
    case 'pick-route': setInput(d.route); break;
    case 'pick-dir': {
      const r = S.dirs.find(x => x.bound === d.bound && x.service_type === d.st);
      if (r) { renderDirTabs(r); loadRoute(r); }
      break;
    }
    case 'pick-stop': selectStop(Number(d.seq)); break;
    case 'fav-stop': {
      const s = S.curStops.find(x => x.seq === Number(d.seq));
      if (!s || !S.cur) break;
      const added = toggleFav({ t: 's', route: S.cur.route, bound: S.cur.bound, service_type: S.cur.service_type, stop: s.id, seq: s.seq });
      syncStars();
      toast(added ? `已收藏「${s.info ? s.info.name : '此站'}」` : '已取消收藏');
      break;
    }
    case 'fav-route': {
      if (!S.cur) break;
      const added = toggleFav({ t: 'r', route: S.cur.route, bound: S.cur.bound, service_type: S.cur.service_type });
      syncRouteStar();
      toast(added ? `已收藏 ${S.cur.route} 往 ${S.cur.dest}` : '已取消收藏');
      break;
    }
    case 'unfav': {
      const f = S.favs.find(x => favKey(x) === d.key || (x.t === 'r' && favKey(x) === d.key));
      if (f) { S.favs.splice(S.favs.indexOf(f), 1); store.set('kmb_favorites', S.favs); }
      if (S.tab === 'home') { renderHome(); syncTimers(); } else renderFavs();
      break;
    }
    case 'toggle-map': setMapOn(!S.mapOn); break;
    case 'nearest': nearestOnRoute(); break;
    case 'share': shareEta(); break;
    case 'alert-stop': toggleAlert(Number(d.seq)); break;
    case 'refresh': if (S.cur) { loadRoute(S.cur, { silent: true }); toast('正在更新班次…'); } break;
    case 'retry': if (S.cur) loadRoute(S.cur); break;
    case 'toggle-stop': toggleNb(d.stop); break;
    case 'relocate': renderNearby(); break;
    case 'key': typeKey(d.key); break;
    case 'del': deleteKey(); break;
    case 'clear': clearKey(); if (S.tab === 'search') showKeyboard(); break;
    case 'hide-kb': hideKeyboard(); break;
    case 'theme': applyTheme(S.theme === 'dark' ? 'light' : 'dark'); break;
    case 'reboot': boot(); break;
    case 'map-big': toggleMapBig(); break;
    case 'map-fit': S.needFit = true; tryFit(); break;
    case 'map-locate': locateMe(); break;
    case 'map-zin': if (map) map.zoomIn(); break;
    case 'map-zout': if (map) map.zoomOut(); break;
    case 'msg-read': markRead(); renderMsgs(); break;
    case 'msg-clear': S.msgs = []; store.set('kmb_msgs', S.msgs); updateBadge(); renderMsgs(); break;
    case 'cfg-alert': S.cfg.alertMin = Number(d.v); saveCfg(); renderSettings(); toast(`剩 ${S.cfg.alertMin} 分鐘內提醒你`); break;
    case 'cfg-wake': S.cfg.wake = !S.cfg.wake; saveCfg(); setWake(); renderSettings(); break;
    case 'cfg-lang': S.cfg.lang = d.v; saveCfg(); applyLang(); break;
    case 'cfg-notif':
      if (!('Notification' in window)) toast('此瀏覽器不支援通知');
      else if (Notification.permission === 'default') Notification.requestPermission().then(renderSettings);
      else toast('請在瀏覽器的網站設定中更改通知權限');
      break;
    case 'wipe':
      if (confirm('確定清除這部裝置上的全部收藏、最近查看、訊息及設定？')) {
        try { Object.keys(localStorage).filter(k => k.startsWith('kmb_')).forEach(k => localStorage.removeItem(k)); } catch { /* 略過 */ }
        location.reload();
      }
      break;
  }
});

input.addEventListener('click', showKeyboard);
input.addEventListener('focus', showKeyboard);

// 電腦實體鍵盤支援
document.addEventListener('keydown', e => {
  if (S.tab !== 'search' || e.ctrlKey || e.metaKey || e.altKey || !S.ready) return;
  if (e.key === 'Backspace') { deleteKey(); e.preventDefault(); }
  else if (e.key === 'Escape') hideKeyboard();
  else if (/^[a-z0-9]$/i.test(e.key)) { typeKey(e.key.toUpperCase()); if (e.target === document.body || e.target === input) e.preventDefault(); }
});

/* ========== 鎖定縮放（地圖內仍可用手指或 +/- 按鈕縮放） ========== */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 && !e.target.closest('#map')) e.preventDefault(); }, { passive: false });
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '_', '0'].includes(e.key)) e.preventDefault(); });
document.addEventListener('visibilitychange', () => { if (S.cfg.wake) setWake(); });

/* ========== 啟動 ========== */
async function boot() {
  const bootEl = $('#boot');
  bootEl.hidden = false;
  bootEl.innerHTML = '<div class="spin"></div><div>載入路線資料…</div>';
  try {
    const [stopsJ, routesJ] = await Promise.all([fetchJSON(`${API}/stop/`), fetchJSON(`${API}/route/`)]);
    S.stops = {};
    for (const s of stopsJ.data) S.stops[s.stop] = { n: { tc: s.name_tc, en: s.name_en, sc: s.name_sc }, get name() { return this.n[LANG] || this.n.tc; }, lat: parseFloat(s.lat), lng: parseFloat(s.long) };
    S.routes = routesJ.data;
    for (const r of S.routes) Object.defineProperties(r, { dest: { get() { return this[`dest_${LANG}`] || this.dest_tc; } }, orig: { get() { return this[`orig_${LANG}`] || this.orig_tc; } } });
    indexRoutes(S.routes);
    S.ready = true;
    buildKeyboard();
    updateKeys();
    renderHome();
    if (S.tab === 'fav') renderFavs(); else if (S.tab === 'nearby') renderNearby();
    bootEl.hidden = true;
    setWake();
    setTimeout(checkWatched, 1500);
    syncAlertTimer(); fetchUrgent();
    if (!S.tUrg) S.tUrg = setInterval(() => { if (!document.hidden) fetchUrgent(); }, 120000);
  } catch (err) {
    console.error('載入 API 失敗:', err);
    bootEl.innerHTML = '<div>無法載入路線資料<br>請檢查網絡連線後重試</div><button type="button" class="pill" data-act="reboot">重試</button>';
  }
}

applyLang();
applyTheme(S.theme);
updateBadge();
setMapOn(S.mapOn);
updateClock();
setInterval(updateClock, 5000);
boot();
})();
</script>
